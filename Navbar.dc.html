    this.bgRaf = requestAnimationFrame(this.animateBg);

  railRef = (el) => { this.rail = el; this.updateRail(); };

    rail.style.transform = shown ? 'translateX(0)' : 'translateX(100%)';
    const k = rail.children.length;

  loadTranslate() {

  initFigures() {

      'onze-partners': ['metselen', 'leunen', 'glazen-klinken'],

    let seed = 0; for (const ch of key) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;

    const mob = window.innerWidth < 760;
    let t = 0; const q = () => { clearTimeout(t); t = setTimeout(place, 120); };

  initMobileType() {

  componentDidMount() {

      { label: 'Events', href: '/events', sub: [{ label: 'Plezier', href: '/plezier' }, { label: 'Sport', href: '/sport' }, { label: 'Cultuur', href: '/cultuur' }, { label: 'Tutor', href: '/tutor' }, { label: 'Lezingen', href: '/lezingen' }, { label: 'TAXI-lezingen', href: '/taxi-lezingen' }] },
      { label: 'Merch', href: '/merch' },
      { label: 'Contact', href: '/contact', sub: [{ label: 'FAQ', href: '/faq' }] },
      { label: 'Partners', href: '/partners', sub: [{ label: 'Onze partners', href: '/onze-partners' }, { label: 'Vacatures', href: '/vacatures' }, { label: 'Voordelen Lidkaart', href: '/word-lid#voordelen' }] }

      const isActive = p.label === active;
      const on = hover === p.label || (isActive && hover === null);
      return {
        ...p,
        current: isActive ? 'page' : undefined,
        line: on ? 'scaleX(1)' : 'scaleX(0)',
        origin: on || lastHover !== p.label ? 'left' : 'right',
        activeLine: isActive ? 'scaleX(1)' : 'scaleX(0)',
        sub: p.sub ? [{ label: ({ Events: 'Alle events', Partners: 'Partnerpakketten', Contact: 'Contact' })[p.label] + ' →', href: p.href }, ...p.sub] : [],
        hasSub: !!p.sub,
        popup: p.sub ? 'true' : undefined,
        expanded: p.sub ? String(hover === p.label) : undefined,
        caret: hover === p.label ? 'rotate(225deg) translate(-2px,-2px)' : 'rotate(45deg)',
        vis: hover === p.label ? 'visible' : 'hidden',

        drop: hover === p.label ? 'translateY(0)' : 'translateY(-8px)',
